version: 2
updates:
  # Python deps — pyproject.toml + uv.lock. Native "uv" ecosystem (not "pip"), so Dependabot
  # updates uv.lock directly instead of fighting uv's resolver.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR per week instead of one per outdated package.
      python-dependencies:
        patterns:
          - "*"

  # The Dockerfile's base image (python:3.12-slim or similar).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # The Actions used by .github/workflows/*.yml themselves.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
