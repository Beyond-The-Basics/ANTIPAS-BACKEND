name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check ./app

      - name: Ruff format check
        run: uv run ruff format --check ./app

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: antipas
          POSTGRES_PASSWORD: antipas
          POSTGRES_DB: antipas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antipas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://antipas:antipas@localhost:5432/antipas_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not just this ref — gitleaks' `git` mode scans commit diffs, so a
          # secret committed and later removed from the working tree is still caught.
          fetch-depth: 0

      - name: Gitleaks
        # The gitleaks CLI itself is free and open source; only the gitleaks-action wrapper
        # requires a paid GITLEAKS_LICENSE for organization-owned repos. Running the image
        # directly avoids that entirely.
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git --redact --no-banner -v /repo

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, secrets]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: antipas-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
